# Production Docker Compose — images built in CI and pulled from Artifact Registry.
#
# On the VM (/opt/ai-estimate/deploy):
#   export IMAGE_REGISTRY=asia-northeast1-docker.pkg.dev/PROJECT_ID/ai-estimate
#   export IMAGE_TAG=latest
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ${IMAGE_REGISTRY}/api:${IMAGE_TAG:-latest}
    env_file: .env
    volumes:
      - upload_data:/data/uploads
      - export_data:/data/exports
    depends_on:
      db:
        condition: service_healthy
      hermes:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${IMAGE_REGISTRY}/web:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  hermes:
    image: ${IMAGE_REGISTRY}/hermes:${IMAGE_TAG:-latest}
    volumes:
      - upload_data:/data/uploads:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
  export_data:
