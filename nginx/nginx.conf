events {
    worker_connections 1024;
}

http {
    # Re-resolve Docker service names when upstream containers restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Default is 1m; document PDF uploads commonly exceed that.
    client_max_body_size 50m;

    server {
        listen 80;

        # Route all traffic (including /api/*) through Next.js.
        # Next.js sets auth cookies and proxies API calls to FastAPI internally.
        location / {
            set $upstream_web http://web:3000;
            proxy_pass $upstream_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
