# Production VM deploy — build on the server (no GitHub Actions / Artifact Registry).
#
#   cd /opt/ai-estimate/app
#   docker compose --env-file /opt/ai-estimate/deploy/.env -f docker-compose.vm.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./api
    env_file: /opt/ai-estimate/deploy/.env
    volumes:
      - upload_data:/data/uploads
      - export_data:/data/exports
    depends_on:
      db:
        condition: service_healthy
      hermes:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    env_file: /opt/ai-estimate/deploy/.env
    depends_on:
      - api
    restart: unless-stopped

  hermes:
    build: ./hermes
    volumes:
      - upload_data:/data/uploads:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
  export_data:
